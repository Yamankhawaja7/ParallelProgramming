services:
  mysql:
    image: mysql:8.0
    container_name: parallism_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: parallism
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-proot"]
      retries: 3
      timeout: 5s

  redis:
    image: redis:alpine
    container_name: parallism_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:
